<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="table.css">
</head>
<body>
    <h1>Table</h1>
    
    <table>
        <thead>
            <tr>
                <th>Employee Id</th>
                <th>Name</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>14</td>
                <td>Sarah</td>
            </tr>
            <tr>
                <td>15</td>
                <td>Shaun</td>
            </tr>
        </tbody>
    <table>

    <h2>weekly Schedule</h2>
    <p>colspan merge cells horizontally,rowspan merges cells vertically</p>
    
    <table>
        <thead>
            <tr>
                <th colspan="3">Weekend Shifts</th>
            </tr>
            <tr>
                <th>Employee</th>
                <th>Saturday</th>
                <th>Sunday</th>
            </tr>
        </thead>
        <body>
            <tr>
                <td rowspan="2">Bill Evans</td>
                <td>Morning</td>
                <td>Off</td>
            </tr>
            <tr>
                <td>Off</td>
                <td>Evening</td>
            </tr>

            <tr>
                <td>Laura Matt</td>
                <td>Evening</td>
                <td>Morning</td>
            </tr>
        </body>
    </table>
</body>
</html>
